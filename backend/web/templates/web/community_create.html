<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Community</title>
    <link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
  rel="stylesheet"
>
</head>

<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm">
                    <div class="card-body p-4">

                        <h1 class="mb-2">Create a Community</h1>

                        <p class="text-muted mb-4">
                            Create your own community and become its owner.
                        </p>

                        <form id="community-form">

                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Community Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    name="name"
                                    class="form-control"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">
                                    Description
                                </label>

                                <textarea
                                    id="description"
                                    name="description"
                                    class="form-control"
                                    rows="4"
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="category" class="form-label">
                                    Category
                                </label>

                                <select
                                    id="category"
                                    name="category"
                                    class="form-select"
                                >
                                    <option value="cultural">Cultural / Ethnic</option>
                                    <option value="neighborhood">Neighborhood</option>
                                    <option value="religious">Religious / Spiritual</option>
                                    <option value="professional">Professional</option>
                                    <option value="education">Education / Students</option>
                                    <option value="family">Parents / Families</option>
                                    <option value="sports">Sports</option>
                                    <option value="health">Health / Wellness</option>
                                    <option value="meditation">Meditation</option>
                                    <option value="technology">Technology</option>
                                    <option value="arts">Arts / Music</option>
                                    <option value="business">Business</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="location" class="form-label">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    id="location"
                                    name="location"
                                    class="form-control"
                                >
                            </div>

                            <div class="mb-3">
                                <label for="privacy" class="form-label">
                                    Privacy
                                </label>

                                <select
                                    id="privacy"
                                    name="privacy"
                                    class="form-select"
                                >
                                    <option value="public">Public</option>
                                    <option value="members">Members Only</option>
                                    <option value="private">Private</option>
                                </select>
                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary w-100"
                            >
                                Create Community
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
